import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.example.vipfinance'
    compileSdk 36
    defaultConfig {
        applicationId "com.example.vipfinance"
        minSdk 24
        targetSdk 36
        versionCode 520
        versionName "5.2" // New VIP Finance icon and 2.5s launch screen
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    if (System.getenv("VIP_KEYSTORE_PATH")) {
        signingConfigs {
            release {
                storeFile file(System.getenv("VIP_KEYSTORE_PATH"))
                storePassword System.getenv("VIP_KEYSTORE_PASSWORD")
                keyAlias System.getenv("VIP_KEY_ALIAS")
                keyPassword System.getenv("VIP_KEY_PASSWORD")
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation(platform("androidx.compose:compose-bom:2026.05.01"))
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}