name: Build VIP Finance APK

on:
  push:
    branches: [main, ai-stitch, ai-sleek, ai-uizard]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify debug APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP-Finance-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VIP_KEYSTORE_BASE64: ${{ secrets.VIP_KEYSTORE_BASE64 }}
        run: |
          test -n "$VIP_KEYSTORE_BASE64"
          echo "$VIP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vip-finance-release.jks"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VIP_KEYSTORE_PATH: ${{ runner.temp }}/vip-finance-release.jks
          VIP_KEYSTORE_PASSWORD: ${{ secrets.VIP_KEYSTORE_PASSWORD }}
          VIP_KEY_ALIAS: ${{ secrets.VIP_KEY_ALIAS }}
          VIP_KEY_PASSWORD: ${{ secrets.VIP_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: VIP-Finance-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk VIP-Finance.apk
          gh release create "$${{ github.ref_name }}" VIP-Finance.apk \
            --title "VIP Finance ${GITHUB_REF_NAME#v}" \
            --generate-notes
