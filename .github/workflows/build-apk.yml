name: Build VIP Finance APK

on:
  push:
    branches: [main, ai-stitch, ai-sleek, ai-uizard]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIP-Finance-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.VIP_KEYSTORE_BASE64 }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vip-release.jks"

      - name: Build signed release
        env:
          VIP_KEYSTORE_PATH: ${{ runner.temp }}/vip-release.jks
          VIP_KEYSTORE_PASSWORD: ${{ secrets.VIP_KEYSTORE_PASSWORD }}
          VIP_KEY_ALIAS: ${{ secrets.VIP_KEY_ALIAS }}
          VIP_KEY_PASSWORD: ${{ secrets.VIP_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
              --title "VIP Finance $VERSION" \
              --notes "Автоматический релиз VIP Finance $VERSION"
          fi
