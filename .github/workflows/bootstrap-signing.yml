name: Bootstrap VIP Finance signing key

on: workflow_dispatch

permissions:
  contents: read

jobs:
  create-signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate permanent signing key
        run: |
          set -e
          mkdir -p signing
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -v -keystore signing/vip-finance-release.jks -storetype JKS -storepass "$PASSWORD" -keypass "$PASSWORD" -alias vip-finance -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=VIP Finance, OU=VIP Finance, O=VIP Finance, C=RU"
          base64 -w 0 signing/vip-finance-release.jks > signing/vip-finance-release.base64
          printf '%s' "$PASSWORD" > signing/password.txt
          printf '%s\n' "VIP Finance signing key bootstrap" > signing/README.txt
          printf '%s\n' "Secrets to create: VIP_KEYSTORE_BASE64, VIP_KEYSTORE_PASSWORD, VIP_KEY_ALIAS, VIP_KEY_PASSWORD" >> signing/README.txt
          printf '%s\n' "VIP_KEY_ALIAS value: vip-finance" >> signing/README.txt
          printf '%s\n' "Use the same password for VIP_KEYSTORE_PASSWORD and VIP_KEY_PASSWORD." >> signing/README.txt
          printf '%s\n' "Do not commit or share the key/password." >> signing/README.txt

      - name: Upload signing package
        uses: actions/upload-artifact@v4
        with:
          name: VIP-Finance-signing-bootstrap
          path: signing
          retention-days: 3
